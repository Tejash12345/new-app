# FocusLion self-hosted Coturn — production TURN relay for WebRTC calls.
# Relays audio/video when both peers are behind carrier NAT (Jio↔Airtel↔Vi),
# which is the ONLY case a call cannot connect peer-to-peer.
#
# Fill in the two <PLACEHOLDERS> below, then deploy (see README.md).

# Listen for TURN on the standard ports (UDP+TCP 3478, TLS 5349).
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0

# The VM's PUBLIC IP. On most clouds the box only sees its private IP, so we
# must tell Coturn its public address or relayed candidates are unroutable.
external-ip=<PUBLIC_IP>

# Long-term credential auth — the web app sends this exact user/pass.
lt-cred-mech
user=focuslion:<STRONG_PASSWORD>
realm=focuslion.turn

# Relay port range (open these UDP ports in the cloud firewall too).
min-port=49152
max-port=65535

# Hardening + reliability
fingerprint
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1
# don't relay to private ranges (SSRF protection)
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
allowed-peer-ip=0.0.0.0-9.255.255.255

# stdout logging so `docker logs` shows allocations
log-file=stdout
simple-log
